<!DOCTYPE html>
<html>
<head>
    <title>Test OAuth Click</title>
</head>
<body>
    <h1>Testing OAuth Login</h1>
    <button id="testGoogle">Test Google OAuth</button>
    <button id="testGithub">Test GitHub OAuth</button>
    <div id="result"></div>

    <script>
        document.getElementById('testGoogle').addEventListener('click', async () => {
            console.log('Clicking Google OAuth...');
            const result = document.getElementById('result');
            result.innerHTML = 'Testing Google OAuth...';
            
            try {
                // Test the sign-in endpoint
                const res = await fetch('http://localhost:3000/api/auth/signin/google');
                result.innerHTML = `Status: ${res.status}<br>`;
                
                // Show if it's redirecting
                if (res.redirected) {
                    result.innerHTML += `Redirected to: ${res.url}<br>`;
                    window.location.href = res.url;
                } else {
                    const text = await res.text();
                    result.innerHTML += text.substring(0, 500);
                }
            } catch (error) {
                result.innerHTML = `Error: ${error.message}`;
                console.error(error);
            }
        });

        document.getElementById('testGithub').addEventListener('click', async () => {
            console.log('Clicking GitHub OAuth...');
            const result = document.getElementById('result');
            result.innerHTML = 'Testing GitHub OAuth...';
            
            try {
                const res = await fetch('http://localhost:3000/api/auth/signin/github');
                result.innerHTML = `Status: ${res.status}<br>`;
                
                if (res.redirected) {
                    result.innerHTML += `Redirected to: ${res.url}<br>`;
                    window.location.href = res.url;
                } else {
                    const text = await res.text();
                    result.innerHTML += text.substring(0, 500);
                }
            } catch (error) {
                result.innerHTML = `Error: ${error.message}`;
                console.error(error);
            }
        });
    </script>
</body>
</html>
