<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form Test</title>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        background: #1a1a1a;
        color: #00ff00;
      }
      .test-case {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #333;
        background: #222;
      }
      .pass {
        color: #00ff00;
      }
      .fail {
        color: #ff0000;
      }
      .info {
        color: #ffff00;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Registration Form Validation Tests</h1>
    <div id="results"></div>

    <script>
      const API_URL = 'http://localhost:3000/api/register';
      const results = document.getElementById('results');

      function addResult(title, status, message) {
        const div = document.createElement('div');
        div.className = 'test-case';
        div.innerHTML = `
                <strong>${status === 'pass' ? '✅' : status === 'fail' ? '❌' : 'ℹ️'} ${title}</strong><br>
                <span class="${status}">${message}</span>
            `;
        results.appendChild(div);
      }

      async function runTests() {
        addResult(
          'Starting Tests',
          'info',
          'Running comprehensive validation tests...',
        );

        // Test 1: Empty email
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: '',
              password: 'password123',
              timezone: 'America/New_York',
              countryCode: 'US',
            }),
          });
          const data = await res.json();
          addResult(
            'Test 1: Empty Email',
            res.status === 400 ? 'pass' : 'fail',
            `Expected 400, got ${res.status}. Message: ${data.error || JSON.stringify(data.details)}`,
          );
        } catch (e) {
          addResult('Test 1: Empty Email', 'fail', e.message);
        }

        // Test 2: Invalid email format
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: 'not-an-email',
              password: 'password123',
              timezone: 'America/New_York',
              countryCode: 'US',
            }),
          });
          const data = await res.json();
          addResult(
            'Test 2: Invalid Email Format',
            res.status === 400 ? 'pass' : 'fail',
            `Expected 400, got ${res.status}. Message: ${data.error || JSON.stringify(data.details)}`,
          );
        } catch (e) {
          addResult('Test 2: Invalid Email Format', 'fail', e.message);
        }

        // Test 3: Password too short
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: 'test@example.com',
              password: '12345',
              timezone: 'America/New_York',
              countryCode: 'US',
            }),
          });
          const data = await res.json();
          addResult(
            'Test 3: Password Too Short',
            res.status === 400 ? 'pass' : 'fail',
            `Expected 400, got ${res.status}. Message: ${data.error || JSON.stringify(data.details)}`,
          );
        } catch (e) {
          addResult('Test 3: Password Too Short', 'fail', e.message);
        }

        // Test 4: Valid registration
        try {
          const testEmail = `test-${Date.now()}@example.com`;
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: testEmail,
              password: 'password123',
              timezone: 'America/New_York',
              countryCode: 'US',
            }),
          });
          const data = await res.json();
          addResult(
            'Test 4: Valid Registration',
            res.status === 201 ? 'pass' : 'fail',
            `Expected 201, got ${res.status}. User: ${data.user?.email || 'Not created'}`,
          );
        } catch (e) {
          addResult('Test 4: Valid Registration', 'fail', e.message);
        }

        addResult(
          'Tests Complete',
          'info',
          'All validation tests finished! Check the form at http://localhost:3000/register',
        );
      }

      runTests();
    </script>
  </body>
</html>
